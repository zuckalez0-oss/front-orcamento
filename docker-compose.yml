services:
  backend:
    build: ./backend-orcamentos
    container_name: geoquote-backend
    restart: unless-stopped
    environment:
      # Postgres do projeto Supabase (ver backend-orcamentos/.env.example e
      # supabase/schema_contas.sql — precisa já ter rodado lá antes de subir
      # este serviço). Sem DATABASE_URL definido, o backend cai num SQLite
      # local dentro do container (perdido a cada rebuild) — só serve pra
      # smoke test, não use em produção sem essas variáveis preenchidas.
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    expose:
      - "8000"

  frontend:
    build:
      context: ./front-orcamentos
      args:
        VITE_API_BASE: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: geoquote-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persiste os certificados Let's Encrypt entre rebuilds — sem isso,
      # cada `docker compose up --build` re-emitiria certificado (risco de
      # esbarrar no rate limit do Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
